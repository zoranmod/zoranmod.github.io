<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d1016">
  <title>Skyfold and other projects by zoranmod</title>
  <meta name="description" content="Skyfold: iCloud Photos, iCloud Drive, Apple Notes and Safari bookmarks on Windows, in real folders. Free and open source.">
  <link rel="canonical" href="https://zoranmod.github.io/">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="icon-96.png" type="image/png" sizes="96x96">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root { color-scheme: dark }
    * { box-sizing: border-box }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
      background: radial-gradient(60% 50% at 50% 30%, rgba(79, 141, 255, .18), transparent 70%), #0d1016;
      color: #edf1f7; font: 17px/1.6 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    }
    main { width: min(560px, 100%); text-align: center }
    .muted { color: #9ba7b9; font-size: 15px }
    a.card {
      display: flex; gap: 18px; align-items: center; margin-top: 22px; padding: 22px; text-align: left;
      border-radius: 18px; background: #171c25; border: 1px solid #262e3d; color: inherit; text-decoration: none;
      transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease;
    }
    a.card:hover { border-color: rgba(143, 184, 255, .4); box-shadow: 0 16px 40px -18px rgba(79, 141, 255, .55) }
    a.card:focus-visible { outline: 3px solid #f3c969; outline-offset: 3px }
    a.card img { width: 64px; height: 64px; border-radius: 16px; flex: none }
    a.card b { display: block; font-size: 20px }
    a.card span { display: block; color: #c3ccd9; font-size: 15px }
    a.card em { display: block; margin-top: 6px; color: #8fb8ff; font-style: normal; font-size: 14px; font-weight: 600 }
    @media (prefers-reduced-motion: no-preference) { a.card:hover { transform: translateY(-2px) } }
  </style>
</head>
<body>
  <main>
    <p class="muted">Projects by zoranmod</p>
    <a class="card" href="/skyfold/">
      <img src="icon-192.png" alt="" width="64" height="64">
      <div>
        <b>Skyfold</b>
        <span>iCloud Photos, iCloud Drive, Apple Notes and Safari bookmarks on Windows, in real folders. Free and open source.</span>
        <em>zoranmod.github.io/skyfold →</em>
      </div>
    </a>
  </main>
</body>
</html>
